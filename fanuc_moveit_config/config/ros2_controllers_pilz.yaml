# Resolved (substitution-free) copy of
# fanuc_hardware_interface/config/ros2_controllers.yaml for the XML frontend
# launch (pilz.launch.xml). The original uses launch substitutions ($(var prefix),
# $(var gpio_config_package), $(var gpio_config_path)) that the Python launch
# expands via ParameterFile(allow_substs=True); the frontend launch's
# "<param from=...>" loads files raw and cannot expand them, so unresolved
# "$(var prefix)J1" joint names crash ros2_control_node. Defaults used here match
# the Python launch defaults: prefix="" and the example GPIO config. If you set a
# non-empty robot prefix or a different GPIO config, update this file accordingly.
/**:
  ros__parameters:
    update_rate: 200 # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: fanuc_controllers/ScaledJointTrajectoryController
    fanuc_gpio_controller:
      type: fanuc_controllers/FanucGPIOController
    forward_position_controller:
      type: forward_command_controller/ForwardCommandController
    fanuc_force_sensor_broadcaster:
      type: fanuc_controllers/FanucForceSensorBroadcaster
    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

/**/fanuc_gpio_controller:
  ros__parameters:
    gpio_config_file_package: fanuc_hardware_interface
    gpio_config_file_path: config/example_gpio_config.yaml

/**/joint_trajectory_controller:
  ros__parameters:
    joints:
      - "J1"
      - "J2"
      - "J3"
      - "J4"
      - "J5"
      - "J6"
    command_interfaces:
      - position
    state_interfaces:
      - position
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false # Set to false to suppress deprecation warning
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      J1:
        goal: 0.05
        trajectory: 0.25
      J2:
        goal: 0.05
        trajectory: 0.25
      J3:
        goal: 0.05
        trajectory: 0.25
      J4:
        goal: 0.05
        trajectory: 0.25
      J5:
        goal: 0.05
        trajectory: 0.25
      J6:
        goal: 0.05
        trajectory: 0.25

/**/forward_position_controller:
  ros__parameters:
    joints:
      - "J1"
      - "J2"
      - "J3"
      - "J4"
      - "J5"
      - "J6"
    interface_name: "position"

/**/force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: "ft_sensor"
    frame_id: "fanuc_flange"
